const params=new URLSearchParams(location.search),themes=['glass','pulse','white'];
let theme=themes.includes(params.get('theme'))?params.get('theme'):'glass',scenario=['normal','offline','unknown','long'].includes(params.get('scenario'))?params.get('scenario'):'normal',metric=2,active=null,locked=false,page='overview',timer,lastWheel=0;
if(params.get('embedded')==='1')document.body.classList.add('embedded');
const total=10000000,today=850000,projects=[{id:'task-usage',name:'用量小助手',avatar:'🧭',status:'开发中',next:'核验 Notion 任务与胶囊联动',goal:'把项目进展和 AI 投入放在一起',summary:'项目管理详情与三种外观正在审阅。',priority:'高',health:'正常',due:'10月18日',open:1,blocked:0,done:6,manual:null,linked:true,token:6250000,today:650000,sessions:6},{id:'task-podcast',name:'收藏2播客',avatar:'🎙️',status:'开发中',next:'剪辑第一期访谈的开场',goal:'让收藏变成可听的故事',summary:'已整理访谈素材，下一步进入剪辑。',priority:'中',health:'正常',due:'10月16日',open:2,blocked:0,done:4,manual:35,linked:true,token:2100000,today:200000,sessions:4},{id:'task-ip',name:'个人 IP 建立',avatar:'🌱',status:'计划中',next:'整理三个想持续讨论的选题',goal:'持续表达自己的经验',summary:'正在确定内容方向。',priority:'中',health:'未评估',due:'未设置',open:0,blocked:0,done:0,manual:null,linked:false,token:0,today:null,sessions:null}];
function displayProject(p){if(scenario!=='long'||p.id!=='task-usage')return p;return {...p,name:'用量小助手 · 项目管理与投入记录的长名称演示',next:'核验项目状态、开发产出和 Notion 文档之间的关联。'.repeat(10),goal:'把项目进展和 AI 投入放在一起。'.repeat(10),summary:'已完成桌面胶囊、三种外观与真实用量同步，相关验收文档保留在项目工作台。'.repeat(10)}}
const token=n=>n==null?'未取得':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const book='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 3h11v18H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z"/><path d="M4 18a3 3 0 0 1 3-3h11M8 6h6"/></svg>',folder='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9H3Z"/></svg>';
const metrics=['周剩余','5h 剩余','周额度已用','本周累计','本周超额'];
function progress(p){if(p.manual!=null)return {value:p.manual,label:'开发进度',source:'manual'};if(scenario==='offline'||scenario==='unknown'||p.open+p.done===0)return {value:null,label:'行动完成率',source:null};return {value:p.done*100/(p.done+p.open),label:'行动完成率',source:'tasks'}}
function quota(){if(scenario==='unknown')return {value:null,text:'未取得'};let raw=[72,65,28,128,28][metric];return {value:raw,text:(scenario==='offline'&&metric<3?'≈':metric===3?'≈':metric===4?'≥':'')+raw.toFixed(metric>2?1:0)+'%'}}
function rings(primary,secondary){const arc=(r,p,extra='')=>p==null?'':`<circle class="arc ${extra}" cx="30" cy="30" r="${r}" stroke-dasharray="${Math.min(100,Math.max(0,p))*2*Math.PI*r/100} ${2*Math.PI*r}"/>`;return `<svg class="rings" viewBox="0 0 60 60" aria-hidden="true"><circle class="track" cx="30" cy="30" r="27"/><circle class="track" cx="30" cy="30" r="22"/>${arc(27,primary)}${arc(22,secondary,'inner')}</svg>`}
function entries(){return [{id:'quota',name:'Codex',icon:`<img src="${OPENAI_LOGO}" alt="">`,outer:quota().value,inner:null},{id:'total',name:'本机 Token 账本',icon:book,outer:null,inner:null},...projects.map(displayProject).map(p=>({id:p.id,name:p.name,icon:scenario==='unknown'?folder:esc(p.avatar),outer:p.linked&&scenario!=='unknown'?p.token*100/total:null,inner:progress(p).value}))]}

const kpi=(label,value)=>`<div class="kpi"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div></div>`,row=(label,value)=>`<div class="row"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`,bar=(label,value,outer=false)=>row(label,value==null?'未取得':value.toFixed(1)+'%')+(value==null?'':`<div class="progress ${outer?'outer':''}" style="--pct:${Math.min(100,value)}%"><span></span></div>`),head=(title,sub)=>`<div class="card-head"><div><h1 class="card-title">${esc(title)}</h1><div class="sub">${esc(sub)}</div></div><span class="badge">演示数据</span></div>`;
const pages=['overview','actions','investment'];

function card(id){

  return head('Codex','当前额度窗口 · '+(scenario==='offline'?'缓存待更新':'演示数据'))+tabs+content+(locked?'':note('点击查看完整记录'));
 }
 if(id==='total')return head('本机 Token 账本','自然周记录 · 演示 10月12日—18日')+tabs+`<div class="kpis">${kpi('今日已记录',token(scenario==='unknown'?null:today))}${kpi('本周已记录',token(total))}</div>`+row('管理项目','3 个')+(selected==='overview'?'':row('可识别响应','100 次')+row('记录质量','本机保留记录'))+note(selected==='investment'?'本机保留记录中的投入，不代表订阅剩余额度或最终账单。':'项目列表不会改变本机总数与占比分母。');
 const p=displayProject(projects.find(p=>p.id===id)),pr=progress(p),linked=p.linked&&scenario!=='unknown',countsKnown=scenario==='normal'||scenario==='long';let content='';
 if(selected==='overview')content=`<div class="status">${esc(p.status)}${scenario==='offline'?' · 缓存待更新':''}</div>`+summary('下一步',p.next)+bar(pr.label,pr.value)+`<div class="kpis">${kpi('本周 Token',linked?token(p.token):'未关联')}${kpi('本周占比',linked?(p.token*100/total).toFixed(1)+'%':'—')}</div>`;
 else if(selected==='actions')content=summary('当前目标',p.goal)+summary('下一步',p.next)+`<div class="facts"><div class="fact"><span>待办 / 受阻</span>${countsKnown?p.open+' 项 / '+p.blocked+' 项':'未取得'}</div><div class="fact"><span>已完成</span>${countsKnown?p.done+' 项':'未取得'}</div></div>`+summary('最新产出与进展',p.summary)+note(p.priority+'优先级 · '+p.health+' · '+p.due);
 else content=`<div class="kpis">${kpi('本周 Token',linked?token(p.token):'未关联')}${kpi('今日 Token',linked?token(p.today):'未取得')}</div>`+row('本周占比',linked?(p.token*100/total).toFixed(1)+'%':'未关联')+row('会话数量',linked?p.sessions+' 个':'未记录')+note('外环：本周 Token 占比 · 内环：'+pr.label)+note(pr.source==='tasks'?'行动完成率仅代表任务清单，不能代替项目整体完成度。':pr.source==='manual'?'开发进度来自 Notion 明确填写的值。':'进度尚未取得，不填成 0%。');
 return head(p.name,'Notion 项目 · 固定演示')+tabs+content+`<button class="action project-link" type="button" data-open-project="${p.id}">查看完整项目 ↗</button>`;
}
function position(){
 if(!active)return;const b=document.querySelector(`[data-id="${active}"]`),popup=document.querySelector('#popover'),scroll=document.querySelector('#card'),r=b.getBoundingClientRect();
 const below=innerHeight-r.bottom-24,above=r.top-24,useBelow=below>=above;let available=Math.max(below,above);
 // Extremely short screens use the viewport as a scrollable fallback, keeping
 // every tab and the complete-project action reachable without clipping.
 if(available<180)available=innerHeight-24;
 scroll.style.maxHeight='none';scroll.style.overflowY='visible';popup.hidden=false;
 const natural=scroll.scrollHeight;if(natural>available){scroll.style.maxHeight=Math.max(48,available)+'px';scroll.style.overflowY='auto'}
 const w=popup.offsetWidth,h=popup.offsetHeight,left=Math.max(12,Math.min(innerWidth-w-12,r.left+r.width/2-w/2));
 let top=useBelow?r.bottom+12:r.top-h-12;top=Math.max(12,Math.min(innerHeight-h-12,top));popup.style.left=left+'px';popup.style.top=top+'px';
 popup.dataset.scrollFallback=String(natural>available);
}
function show(id,lock,preservePage=false){
 if(!preservePage&&(active!==id||!lock))page='overview';active=id;locked=lock;
 const popup=document.querySelector('#popover');document.querySelector('#card').innerHTML=card(id);popup.hidden=false;
 document.querySelectorAll('.orb').forEach(b=>b.setAttribute('aria-expanded',String(b.dataset.id===id)));
 document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;show(id,true,true)}));
 document.querySelector('[data-cycle]')?.addEventListener('click',()=>cycle(1));
 document.querySelector('[data-open-project]')?.addEventListener('click',()=>{const t=document.querySelector('#toast');t.textContent='真实组件会打开对应的 Notion 项目页，查看完整目标、行动、产出文档与历史。此预览不访问账号。';t.hidden=false;setTimeout(()=>t.hidden=true,3500)});position();
}
function close(){clearTimeout(timer);active=null;locked=false;page='overview';document.querySelector('#popover').hidden=true;document.querySelectorAll('.orb').forEach(b=>b.setAttribute('aria-expanded','false'))}
function cycle(step){metric=(metric+step+5)%5;const id=active,lock=locked;render();if(id)show(id,lock,true)}
document.querySelector('#popover').addEventListener('mouseenter',()=>clearTimeout(timer));document.querySelector('#popover').addEventListener('mouseleave',()=>{if(!locked)timer=setTimeout(close,240)});document.addEventListener('click',e=>{const inside=e.composedPath().some(node=>node instanceof Element&&(node.matches('.orb')||node.id==='popover'));if(!inside)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});window.addEventListener('resize',position);
const themeSelect=document.querySelector('#themeSelect'),scenarioSelect=document.querySelector('#scenarioSelect');themeSelect.value=theme;scenarioSelect.value=scenario;themeSelect.addEventListener('change',()=>{theme=themeSelect.value;close();render()});scenarioSelect.addEventListener('change',()=>{scenario=scenarioSelect.value;close();render()});render();if(params.get('card'))requestAnimationFrame(()=>show(params.get('card'),true));
</script></body></html>
