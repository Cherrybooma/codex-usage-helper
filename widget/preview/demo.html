{id:'task-time',name:'时间规划',icon:'⏳',tokens:0,today:0,health:'顺利',progress:null,vision:'用简单的计划与记录，安排每天的时间并回顾投入。',goal:'整理当前功能与演示产出，确定下一阶段的开发目标。',next:'确认下一阶段优先开发的功能。',manual:{open:1,blocked:0,done:0},latest:'项目工作台已建立。',artifact:'现有产出索引'}
];
const OTHER={name:'Codex',tokens:1500000,today:100000},TOTAL=24900000,RESPONSES=1958,QUOTA={remaining:31,used:109},DATES='10月12日—10月18日';
const share=p=>p.tokens/TOTAL*100,token=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n),pct=n=>n.toFixed(1)+'%',money=n=>'≈$'+n.toFixed(2);
const boardStates=new Map([['board-quota',{entry:'quota',view:'overview',page:0}],['board-total',{entry:'total',view:'overview',page:0}],['board-overview',{entry:'task-usage',view:'overview',page:0}],['board-actions',{entry:'task-usage',view:'actions',page:0}],['board-investment',{entry:'task-usage',view:'investment',page:0}]]);
function rings(outer,inner){const arc=(r,p,cls='')=>p==null?'':`<circle class="ring-arc ${cls}" cx="30" cy="30" r="${r}" stroke-dasharray="${Math.min(100,Math.max(0,p))*2*Math.PI*r/100} ${2*Math.PI*r}"/>`;return `<svg class="rings" viewBox="0 0 60 60" aria-hidden="true">${outer==null?'': '<circle class="ring-track" cx="30" cy="30" r="27"/>'}${inner==null?'':'<circle class="ring-track" cx="30" cy="30" r="22"/>'}${arc(27,outer)}${arc(22,inner,'inner')}</svg>`}
function entries(){return [{id:'quota',name:'Codex',icon:icons.codex,outer:QUOTA.remaining},{id:'total',name:'本期 Token',icon:icons.book},...PROJECTS.map(p=>({id:p.id,name:p.name,icon:esc(p.icon),outer:share(p),inner:p.progress})),{id:'other',name:'其他',icon:icons.other,outer:share(OTHER)}]}
function renderCapsule(){$('#widget').className='capsule theme '+theme;$('#widget').innerHTML=entries().map(e=>`<button type="button" class="orb" data-entry="${e.id}" aria-label="${esc(e.name)}：查看详情" aria-expanded="${active===e.id}">${rings(e.outer,e.inner)}<span class="orb-icon">${e.icon}</span></button>`).join('');$('#widget').querySelectorAll('.orb').forEach(b=>{b.addEventListener('mouseenter',()=>{clearTimeout(hoverTimer);if(!locked)hoverTimer=setTimeout(()=>show(b.dataset.entry,false),130)});b.addEventListener('mouseleave',()=>{clearTimeout(hoverTimer);if(!locked)hoverTimer=setTimeout(close,260)});b.addEventListener('focus',()=>{if(!locked)show(b.dataset.entry,false)});b.addEventListener('click',()=>{clearTimeout(hoverTimer);if(locked&&active===b.dataset.entry)close();else show(b.dataset.entry,true)})})}
const metric=(label,value,field,cls='')=>({kind:'metric',label,value,field,cls});
const copy=(label,text,field)=>({kind:'copy',label,text,field});
function projectText(p,key){if(!longText)return p[key];const more={vision:'支持从已有文件夹整理项目愿景、当前进展与正式产出，关联 Notion 工作台，并在桌面胶囊里保持同步。每个阶段都能看清做出了什么、产出放在哪里，以及接下来需要确认的具体事项。',goal:'逐项核对 Codex、本期 Token、项目概览、行动与投入的排版。检查较长的项目愿景、当前目标和产出名称在小窗口里是否完整展示；同时验证三种主题的文字清晰度、整块标签点击热区，以及没有卡内滚动条的分页体验。确认页面后，再把相同的字体与间距应用到桌面组件，并保留现有的统计与排序规则。',next:'先审阅当前目标与较长文字的完整分页，确认字体大小、段落间距和标签热区；随后完成三种主题的桌面核验，并记录正式产出。',latest:'已完成项目导入、Notion 工作台绑定与胶囊动态排序。本轮重点检查字体与留白，长内容通过翻页完整显示。',artifact:'胶囊字体、长文本分页与三种主题交互的完整核验报告'};return p[key]+' '+more[key]}
function specFor(entry,selectedView='overview',full=true){const p=PROJECTS.find(p=>p.id===entry);if(entry==='quota')return{title:'Codex',icon:icons.codex,metrics:true,blocks:[metric('周额度剩余',QUOTA.remaining+'%','quota-remaining','accent'),metric('本周已用额度',QUOTA.used+'%','quota-used'),metric('本周 Token',token(TOTAL),'quota-tokens'),metric('估算投入',money(5*QUOTA.used/100),'quota-cost')]};if(entry==='total')return{title:'本期 Token',icon:icons.book,metrics:true,blocks:[metric('本周 Token',token(TOTAL),'total-tokens'),metric('任务数量',`2<span class="unit">个</span>`,'total-tasks'),metric('统计时间',DATES,'total-dates','text'),metric('模型响应次数',`${RESPONSES.toLocaleString('en-US')}<span class="unit">次</span>`,'total-responses')]};if(entry==='other')return{title:'其他',icon:icons.other,blocks:[metric('本周 Token',token(OTHER.tokens),'other-tokens'),metric('占本周 Token',pct(share(OTHER)),'other-share'),{kind:'other',name:OTHER.name,value:pct(share(OTHER))}]};if(!p)return null;const common={title:p.name,icon:esc(p.icon),notion:full,tabs:full,view:selectedView};if(!full)return{...common,blocks:[{kind:'status',label:'项目状态',value:p.health},copy('下一步行动',projectText(p,'next'),'next-action'),{kind:'progress',value:p.progress},metric('占本周 Token',pct(share(p)),'hover-share')]};if(selectedView==='overview')return{...common,blocks:[{kind:'status',label:'项目状态',value:p.health},copy('项目愿景',projectText(p,'vision'),'vision'),{kind:'progress',value:p.progress},metric('占本周 Token',pct(share(p)),'project-share')]};if(selectedView==='actions')return{...common,blocks:[copy('当前目标',projectText(p,'goal'),'current-goal'),{kind:'manual',values:p.manual},copy('进度记录',projectText(p,'latest'),'latest-progress'),{kind:'artifact',label:'最新产出',text:projectText(p,'artifact'),field:'latest-output'}]};return{...common,metrics:true,blocks:[metric('本周 Token',token(p.tokens),'project-week-tokens'),metric('今日 Token',token(p.today),'project-today-tokens'),metric('占本周 Token',pct(share(p)),'project-week-share'),metric('估算投入',money(5*QUOTA.used/100*share(p)/100),'project-cost')]}}
function blockHTML(b){if(b.kind==='metric')return`<div class="metric" data-field="${b.field}"><span class="label">${esc(b.label)}</span><span class="metric-value ${b.cls||''}">${b.value}</span></div>`;if(b.kind==='copy')return`<section class="copy-block" data-field="${b.field}"><p class="label">${esc(b.label)}</p><p class="copy">${esc(b.text)}</p></section>`;if(b.kind==='status')return`<div class="inline" data-field="project-status"><span class="label">${esc(b.label)}</span><span class="status ${b.value==='遇到卡点'?'blocked':['有风险','需关注'].includes(b.value)?'risk':''}">${esc(b.value)}</span></div>`;if(b.kind==='progress')return`<section data-field="project-progress"><div class="progress-head"><span class="label">完成进度</span><span class="progress-value${b.value==null?' text':''}">${b.value==null?'待评估':b.value+'%'}</span></div><div class="progress-track"><div class="progress-fill" style="width:${b.value??0}%"></div></div></section>`;if(b.kind==='manual')return`<section data-field="manual-actions"><p class="label">人工待办</p><div class="manual-line">${[['待办','open'],['受阻','blocked'],['已完成','done']].map(([l,k])=>`<span class="manual-item">${l}<strong>${b.values[k]}</strong><span class="unit">项</span></span>`).join('')}</div></section>`;if(b.kind==='artifact')return`<section data-field="${b.field}"><p class="label">${esc(b.label)}</p><button type="button" class="artifact" data-demo-output><span class="artifact-title">${esc(b.text)}</span><span class="artifact-arrow" aria-hidden="true">↗</span></button></section>`;if(b.kind==='other')return`<div class="other-list"><div class="other-row"><span class="other-name"><span class="other-emoji" aria-hidden="true">📁</span>${esc(b.name)}</span><span class="other-value">${esc(b.value)}</span></div></div>`;return''}
function headerHTML(spec,canClose){return`<div class="card-head"><div class="identity"><span class="avatar" aria-hidden="true">${spec.icon}</span><h2 class="card-title">${esc(spec.title)}</h2></div>${canClose?`<button type="button" class="close" data-close aria-label="收起详情">${icons.close}</button>`:''}</div>${spec.tabs?`<div class="tabs" role="group" aria-label="项目详情页面">${[['overview','概览'],['actions','行动'],['investment','投入']].map(([v,l])=>`<button type="button" class="tab" data-view="${v}" aria-pressed="${spec.view===v}">${l}</button>`).join('')}</div>`:''}`}
const footerHTML=spec=>spec.notion?'<button type="button" class="footer-link" data-demo-notion><span>在 Notion 查看项目</span><span aria-hidden="true">↗</span></button>':'';
function pageHTML(index,total){return`<nav class="pagination" aria-label="详情分页"><span>第 ${index+1} / ${total} 页</span><span class="page-controls"><button type="button" data-paging="-1" aria-label="上一页" ${index===0?'disabled':''}>${icons.left}</button><button type="button" data-paging="1" aria-label="下一页" ${index===total-1?'disabled':''}>${icons.right}</button></span></nav>`}
function cardHTML(spec,blocks,index,total,canClose,reserveNav=false){return`<div class="card">${headerHTML(spec,canClose)}<div class="content ${spec.metrics?'metrics':''}">${blocks.map(blockHTML).join('')}</div>${total>1||reserveNav?pageHTML(index,total):''}${footerHTML(spec)}</div>`}
function paginate(spec,budget,width,canClose){const measure=$('#measure');measure.className='measure theme '+theme;measure.style.width=width+'px';const fits=bs=>{measure.innerHTML=cardHTML(spec,bs,0,2,canClose,true);return measure.getBoundingClientRect().height<=budget};measure.innerHTML=cardHTML(spec,spec.blocks,0,1,canClose);if(measure.getBoundingClientRect().height<=budget)return[spec.blocks];const pages=[],queue=spec.blocks.map(b=>({...b}));let current=[];let safety=0;while(queue.length&&safety++<500){const block=queue[0];if(fits([...current,block])){current.push(queue.shift());continue}if(current.length){pages.push(current);current=[];continue}if((block.kind==='copy'||block.kind==='artifact')&&block.text.length>1){let lo=1,hi=block.text.length,best=0;while(lo<=hi){const mid=Math.floor((lo+hi)/2);if(fits([{...block,text:block.text.slice(0,mid)}])){best=mid;lo=mid+1}else hi=mid-1}if(best<1)best=1;let cut=best;if(best<block.text.length){const candidate=block.text.slice(0,best),breaks=[candidate.lastIndexOf('。')+1,candidate.lastIndexOf('；')+1,candidate.lastIndexOf('，')+1,candidate.lastIndexOf(' ')+1];const good=breaks.filter(n=>n>best*.65);if(good.length)cut=Math.max(...good)}pages.push([{...block,text:block.text.slice(0,cut)}]);queue[0]={...block,label:block.label.replace(/（续）$/,'')+'（续）',text:block.text.slice(cut)};continue}pages.push([queue.shift()])}if(current.length)pages.push(current);return pages.length?pages:[[]]}
function locatePopover(){const button=$('#widget').querySelector(`[data-entry="${active}"]`);if(!button)return null;const r=button.getBoundingClientRect(),width=Math.min(360,innerWidth-24),below=r.bottom+12,top=innerHeight-below-12>=320?below:12;return{width,top,left:Math.min(Math.max(12,r.left+r.width/2-width/2),innerWidth-width-12),budget:Math.max(1,Math.min(520,innerHeight-top-12))}}
function renderPopover(){if(!active)return;const spec=specFor(active,view,locked),pos=locatePopover();if(!spec||!pos)return;const pages=paginate(spec,pos.budget,pos.width,true);currentPage=Math.min(Math.max(0,currentPage),pages.length-1);const popup=$('#popover');popup.className='popover theme '+theme;popup.dataset.entry=active;popup.dataset.view=view;popup.dataset.mode=locked?'click':'hover';popup.dataset.pageCount=pages.length;popup.style.width=pos.width+'px';popup.style.left=pos.left+'px';popup.style.top=pos.top+'px';popup.innerHTML=cardHTML(spec,pages[currentPage],currentPage,pages.length,true);popup.hidden=false;document.body.classList.add('has-popover')}
function show(entry,lock){clearTimeout(hoverTimer);if(active!==entry||locked!==lock){view='overview';currentPage=0}active=entry;locked=lock;$('#widget').querySelectorAll('.orb').forEach(b=>b.setAttribute('aria-expanded',String(b.dataset.entry===active)));renderPopover()}
function close(){clearTimeout(hoverTimer);active=null;locked=false;view='overview';currentPage=0;$('#popover').hidden=true;document.body.classList.remove('has-popover');$('#widget').querySelectorAll('.orb').forEach(b=>b.setAttribute('aria-expanded','false'))}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,2800)}
function renderBoard(){if($('#comparison').hidden)return;const labels={'board-quota':'Codex · 单页','board-total':'本期 Token · 单页','board-overview':'项目 · 概览','board-actions':'项目 · 行动','board-investment':'项目 · 投入'};$('#boardGrid').innerHTML=[...boardStates].map(([key,state])=>{const spec=specFor(state.entry,state.view,true),width=Math.min(360,innerWidth-24),pages=paginate(spec,520,width,false);state.page=Math.min(Math.max(0,state.page),pages.length-1);return`<div class="board-item" data-board-key="${key}"><p class="board-label">${labels[key]}</p><div class="board-card theme ${theme}">${cardHTML(spec,pages[state.page],state.page,pages.length,false)}</div></div>`}).join('')}
// Only the glass outside clipped circular buttons starts a demo drag.
let capsuleDrag=null,capsuleOffset={x:0,y:0};
$('#widget').addEventListener('pointerdown',e=>{
 if(e.button!==0||e.target.closest('.orb'))return;
 close();capsuleDrag={id:e.pointerId,x:e.clientX,y:e.clientY,start:{...capsuleOffset}};
 $('#widget').setPointerCapture(e.pointerId);$('#widget').classList.add('dragging');e.preventDefault();
});
$('#widget').addEventListener('pointermove',e=>{
 if(!capsuleDrag||e.pointerId!==capsuleDrag.id)return;
 const widget=$('#widget'),r=widget.getBoundingClientRect();
 const x=capsuleDrag.start.x+e.clientX-capsuleDrag.x,y=capsuleDrag.start.y+e.clientY-capsuleDrag.y;
 const dx=Math.min(innerWidth-r.right-8,Math.max(8-r.left,x-capsuleOffset.x));
 const dy=Math.min(innerHeight-r.bottom-8,Math.max(8-r.top,y-capsuleOffset.y));
 capsuleOffset={x:capsuleOffset.x+dx,y:capsuleOffset.y+dy};
 widget.style.translate=`${capsuleOffset.x}px ${capsuleOffset.y}px`;e.preventDefault();
});
function endCapsuleDrag(e){if(!capsuleDrag||e.pointerId!==capsuleDrag.id)return;capsuleDrag=null;$('#widget').classList.remove('dragging');if($('#widget').hasPointerCapture(e.pointerId))$('#widget').releasePointerCapture(e.pointerId)}
$('#widget').addEventListener('pointerup',endCapsuleDrag);$('#widget').addEventListener('pointercancel',endCapsuleDrag);
$('#popover').addEventListener('mouseenter',()=>clearTimeout(hoverTimer));$('#popover').addEventListener('mouseleave',()=>{if(!locked)hoverTimer=setTimeout(close,260)});
$('#popover').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close'))close();else if(b.dataset.view){view=b.dataset.view;currentPage=0;renderPopover()}else if(b.dataset.paging){currentPage+=Number(b.dataset.paging);renderPopover()}else if(b.hasAttribute('data-demo-output'))toast('演示产出链接；演示页不打开真实文件。');else if(b.hasAttribute('data-demo-notion'))toast('演示项目链接；演示页不连接 Notion。')});
$('#boardGrid').addEventListener('click',e=>{const b=e.target.closest('button'),item=e.target.closest('[data-board-key]');if(!b||!item)return;const state=boardStates.get(item.dataset.boardKey);if(b.dataset.view){state.view=b.dataset.view;state.page=0;renderBoard()}else if(b.dataset.paging){state.page+=Number(b.dataset.paging);renderBoard()}else if(b.hasAttribute('data-demo-output'))toast('演示产出链接；演示页不打开真实文件。');else if(b.hasAttribute('data-demo-notion'))toast('演示项目链接；演示页不连接 Notion。')});
document.addEventListener('click',e=>{const inside=e.composedPath().some(node=>node instanceof Element&&['popover','widget','reviewControls','comparison'].includes(node.id));if(!inside)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});window.addEventListener('resize',()=>{if(active)renderPopover();renderBoard()});
$('#themeSelect').value=theme;$('#themeSelect').addEventListener('change',()=>{theme=$('#themeSelect').value;renderCapsule();if(active)renderPopover();renderBoard()});$('#longText').checked=longText;$('#longText').addEventListener('change',()=>{longText=$('#longText').checked;currentPage=0;for(const state of boardStates.values())state.page=0;if(active)renderPopover();renderBoard()});$('#compareToggle').addEventListener('click',()=>{const open=$('#comparison').hidden;$('#comparison').hidden=!open;$('#compareToggle').setAttribute('aria-expanded',String(open));$('#compareToggle').textContent=open?'收起全部详情':'展开全部详情';document.body.classList.toggle('compare-open',open);renderBoard();if(open)close()});
window.layoutReview=Object.freeze({getState:()=>Object.freeze({theme,active,locked,view,currentPage,longText,totalTokens:TOTAL,taskCount:2,projects:PROJECTS.map(p=>Object.freeze({id:p.id,name:p.name,tokens:p.tokens,share:share(p),progress:p.progress})),fontSizes:Object.freeze({label:12,body:14,title:16}),cardWidth:360,padding:20,groupGap:16})});
renderCapsule();if(params.get('compare')==='1'){document.body.classList.add('compare-open');$('#comparison').hidden=false;$('#compareToggle').textContent='收起全部详情';$('#compareToggle').setAttribute('aria-expanded','true');renderBoard()}
const initial=params.get('entry');if(entries().some(e=>e.id===initial)){show(initial,true);if(['overview','actions','investment'].includes(params.get('view')))view=params.get('view');renderPopover()}
</script>
