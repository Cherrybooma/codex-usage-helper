const params=new URLSearchParams(location.search),themes=['glass','pulse','white'];
let theme=themes.includes(params.get('theme'))?params.get('theme'):'glass',scenario=['normal','offline','unknown'].includes(params.get('scenario'))?params.get('scenario'):'normal',metric=2,active=null,locked=false,timer,lastWheel=0;

const token=n=>n==null?'未取得':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const book='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 3h11v18H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z"/><path d="M4 18a3 3 0 0 1 3-3h11M8 6h6"/></svg>',folder='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9H3Z"/></svg>';

function progress(p){if(p.manual!=null)return {value:p.manual,label:'开发进度',source:'manual'};if(scenario==='offline'||scenario==='unknown'||p.open+p.done===0)return {value:null,label:'行动完成率',source:null};return {value:p.done*100/(p.done+p.open),label:'行动完成率',source:'tasks'}}
function quota(){if(scenario==='unknown')return {value:null,text:'未取得'};let raw=[72,65,28,128,28][metric];return {value:raw,text:(scenario==='offline'&&metric<3?'≈':metric===3?'≈':metric===4?'≥':'')+raw.toFixed(metric>2?1:0)+'%'}}
function rings(primary,secondary){const arc=(r,p,extra='')=>p==null?'':`<circle class="arc ${extra}" cx="30" cy="30" r="${r}" stroke-dasharray="${Math.min(100,Math.max(0,p))*2*Math.PI*r/100} ${2*Math.PI*r}"/>`;return `<svg class="rings" viewBox="0 0 60 60" aria-hidden="true"><circle class="track" cx="30" cy="30" r="27"/><circle class="track" cx="30" cy="30" r="22"/>${arc(27,primary)}${arc(22,secondary,'inner')}</svg>`}

function card(id){if(id==='quota')return head('Codex','当前额度窗口 · '+(scenario==='offline'?'上次缓存，等待更新':'示意观测 13:40'))+`<div class="kpis">${kpi(metrics[metric],quota().text)}${kpi('今日 Token',token(scenario==='unknown'?null:today))}</div><div class="switch">${metrics.map((m,i)=>`<button type="button" data-metric="${i}" aria-pressed="${i===metric}">${m}</button>`).join('')}</div>`+row('周窗口剩余',scenario==='unknown'?'未取得':(scenario==='offline'?'≈':'')+'72%')+row('5 小时剩余',scenario==='unknown'?'未取得':(scenario==='offline'?'≈':'')+'65%')+row('周额度重置',scenario==='unknown'?'未取得':'示意：10月18日 21:30')+row('5h 额度重置',scenario==='unknown'?'未取得':'示意：今日 18:20')+row('本周已记录累计',scenario==='unknown'?'未取得':'≈128.0%')+row('已观测超额下限',scenario==='unknown'?'待核实':'≥28.0%')+`<div class="legend"><span><i class="dot"></i>主环：${metrics[metric]}</span><span>内环：中性轨道</span></div><p class="note">圆环最多显示 100%，实际观测累计可超过 100%。跨重置只累计观测到的消耗；不把重置当成新增使用 100%。Token 来自本机记录，不能换算订阅额度。</p>`;
if(id==='total')return head('本机 Token 账本','按北京时间自然周 · 演示 10月12日—18日')+`<div class="kpis">${kpi('今日已记录',token(scenario==='unknown'?null:today))}${kpi('本周已记录',token(total))}</div>`+row('可识别响应','100 次')+row('管理项目','3 个')+row('记录质量',scenario==='unknown'?'部分数据未取得':'本机保留记录')+`<p class="note">两个圆环仅为中性轨道，不代表 Token 额度完成率。Notion 项目列表不会改变本机总数和占比分母，未关联记录同样留在账本。</p>`;
const p=projects.find(p=>p.id===id),pr=progress(p),linked=p.linked&&scenario!=='unknown',countsKnown=scenario==='normal';return head(p.name,scenario==='offline'?'离线缓存 · 项目状态待更新':'Notion 项目管理 · 固定示意')+`<div class="status">${esc(p.status)}</div><div class="focus"><div class="label">下一步</div><p>${esc(p.next)}</p></div>`+bar(pr.label,pr.value)+`<div class="legend"><span><i class="dot"></i>外环：本周 Token 占比</span><span><i class="dot inner"></i>内环：${pr.label}</span></div><div class="facts"><div class="fact"><span>待办 / 受阻</span>${countsKnown?p.open+' 项 / '+p.blocked+' 项':'未取得'}</div><div class="fact"><span>已完成行动</span>${countsKnown?p.done+' 项':'未取得'}</div><div class="fact"><span>优先级 / 健康度</span>${esc(p.priority+' / '+p.health)}</div><div class="fact"><span>交付日期</span>${esc(p.due)}</div></div><div class="section">最新进展</div><p class="body-text">${esc(p.summary)}</p><div class="section">Token 投入 · 附属记录</div><div class="facts"><div class="fact"><span>今日 Token</span>${linked?token(p.today):'未关联本地记录'}</div><div class="fact"><span>本周 Token / 占比</span>${linked?token(p.token)+' / '+(p.token*100/total).toFixed(1)+'%':'未关联本地记录'}</div></div><button class="action" type="button" data-open-project="${p.id}">打开 Notion 项目 ↗</button><p class="note">${pr.source==='tasks'?'行动完成率 = 已完成 /（已完成 + 待办），受阻是待办的子集；它不代表整个项目开发完成度。':pr.source==='manual'?'开发进度来自 Notion 明确填写的 Development Progress；不根据 Token 或任务数量猜测。':'进度尚未取得，不填成 0%。'} 此预览不会访问真实 Notion。</p>`}
function position(){if(!active)return;const b=document.querySelector(`[data-id="${active}"]`),popup=document.querySelector('#popover'),scroll=document.querySelector('#card'),r=b.getBoundingClientRect(),w=popup.offsetWidth;const left=Math.max(12,Math.min(innerWidth-w-12,r.left+r.width/2-w/2)),below=innerHeight-r.bottom-24,above=r.top-24,useBelow=below>=above;scroll.style.maxHeight=Math.max(80,(useBelow?below:above)-2)+'px';const h=popup.offsetHeight;let top=useBelow?r.bottom+12:r.top-h-12;top=Math.max(12,Math.min(innerHeight-h-12,top));popup.style.left=left+'px';popup.style.top=top+'px'}
function show(id,lock){active=id;locked=lock;const popup=document.querySelector('#popover');document.querySelector('#card').innerHTML=card(id);popup.hidden=false;document.querySelectorAll('.orb').forEach(b=>b.setAttribute('aria-expanded',String(b.dataset.id===id)));document.querySelectorAll('[data-metric]').forEach(b=>b.addEventListener('click',()=>cycle(Number(b.dataset.metric)-metric)));document.querySelector('[data-open-project]')?.addEventListener('click',()=>{const t=document.querySelector('#toast');t.textContent='真实组件会打开对应的 Notion 项目页。此处是固定演示，不访问账号。';t.hidden=false;setTimeout(()=>t.hidden=true,3500)});position()}
function close(){clearTimeout(timer);active=null;locked=false;document.querySelector('#popover').hidden=true;document.querySelectorAll('.orb').forEach(b=>b.setAttribute('aria-expanded','false'))}
function cycle(step){metric=(metric+step+5)%5;const id=active,lock=locked;render();if(id)show(id,lock)}
document.querySelector('#popover').addEventListener('mouseenter',()=>clearTimeout(timer));document.querySelector('#popover').addEventListener('mouseleave',()=>{if(!locked)timer=setTimeout(close,240)});document.addEventListener('click',e=>{if(!e.target.closest('.orb')&&!e.target.closest('#popover'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});window.addEventListener('resize',position);
const themeSelect=document.querySelector('#themeSelect'),scenarioSelect=document.querySelector('#scenarioSelect');themeSelect.value=theme;scenarioSelect.value=scenario;themeSelect.addEventListener('change',()=>{theme=themeSelect.value;close();render()});scenarioSelect.addEventListener('change',()=>{scenario=scenarioSelect.value;close();render()});render();if(params.get('card'))requestAnimationFrame(()=>show(params.get('card'),true));
</script></body></html>
